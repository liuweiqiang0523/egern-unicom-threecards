# 更新已有诊断模块，不重复添加；生产 request 捕获不变。
name: 联通在线被动诊断
description: v3 仅入口和余额响应对照，不读正文或头值、不主动刷新
icon: magnifyingglass
manual: https://github.com/liuweiqiang0523/egern-unicom-threecards/blob/main/ONLINE-DIAGNOSTIC.md
scriptings:
  - http_request:
      name: unicom-online-diagnostic-request
      match: '^https://m\.client\.10010\.com/mobileService/onLine\.htm(?:\?|$)'
      script_url: https://raw.githubusercontent.com/liuweiqiang0523/egern-unicom-threecards/b555a909fe1d5fda5a6c21f27de870aa0e5a03f5/UnicomOnlineDiagnostic.js
      timeout: 5
      body_required: false
      max_size: 65536
  - http_response:
      name: unicom-online-diagnostic-response
      match: '^https://m\.client\.10010\.com/mobileService/onLine\.htm(?:\?|$)'
      script_url: https://raw.githubusercontent.com/liuweiqiang0523/egern-unicom-threecards/b555a909fe1d5fda5a6c21f27de870aa0e5a03f5/UnicomOnlineDiagnostic.js
      timeout: 5
      body_required: false
      max_size: 65536
  - http_response:
      name: unicom-online-diagnostic-balance-response
      match: '^https://m\.client\.10010\.com/mobileserviceimportant/home/queryUserInfoSeven(?:\?|$)'
      script_url: https://raw.githubusercontent.com/liuweiqiang0523/egern-unicom-threecards/b555a909fe1d5fda5a6c21f27de870aa0e5a03f5/UnicomOnlineDiagnostic.js
      timeout: 5
      body_required: false
      max_size: 65536
  - generic:
      name: unicom-online-diagnostic-widget
      script_url: https://raw.githubusercontent.com/liuweiqiang0523/egern-unicom-threecards/b555a909fe1d5fda5a6c21f27de870aa0e5a03f5/UnicomOnlineDiagnostic.js
      timeout: 5
widgets:
  - name: 联通在线 · 被动诊断
    script_name: unicom-online-diagnostic-widget
mitm:
  hostnames:
    includes:
      - m.client.10010.com
