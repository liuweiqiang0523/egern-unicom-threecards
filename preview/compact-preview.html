<!doctype html><meta charset="utf-8"><title>三卡汇总 设计预览</title>
<style>body{font:13px system-ui;background:#0e0f13;color:#eee;padding:26px;margin:0}.wrap{display:flex;gap:26px;flex-wrap:wrap}.box{width:360px}.cap{color:#9aa0ad;margin:0 0 8px}.cap b{color:#fff}.holder{border-radius:20px;overflow:hidden}.note{color:#7b8090;margin-top:18px;max-width:760px}</style>
<h2 style="margin:0 0 6px">三卡合一 · 机场订阅卡样式（设计预览）</h2>
<p class="note">合成测试数据，不是真实余额，也不是 iPhone 截图。本页直接执行仓库 <code>UnicomThreeCards.js</code> 并按返回的 DSL 构造 DOM；浏览器字体与 Egern 原生渲染不同。</p>
<div class="wrap">
 <div class="box"><p class="cap"><b>① 无限流量卡：什么都不用填</b><br>没有套餐总量 → 不出百分比，横条是细分隔线</p><div class="holder" id="a"></div></div>
 <div class="box"><p class="cap"><b>② 给有配额的卡填一次参考总量</b><br>卡2 填 500GB → 真实比例填充，其余卡不变</p><div class="holder" id="b"></div></div>
</div>
<script type="module">
import run from '../UnicomThreeCards.js';
const color=c=>typeof c==='object'?c.dark:c;
function render(n){const e=document.createElement('div');e.style.boxSizing='border-box';
 if(n.type==='text'){e.textContent=n.text;e.style.fontSize=n.font.size+'px';e.style.fontWeight={regular:400,medium:500,semibold:600,bold:700}[n.font.weight];e.style.color=color(n.textColor);e.style.whiteSpace='nowrap';e.style.overflow='hidden';e.style.textOverflow='ellipsis';}
 else{e.style.display='flex';e.style.flexDirection=n.direction==='row'?'row':'column';e.style.alignItems=n.alignItems||'stretch';if(n.gap)e.style.gap=n.gap+'px';if(n.padding!==undefined)e.style.padding=Array.isArray(n.padding)?n.padding.map(v=>v+'px').join(' '):n.padding+'px';if(n.backgroundColor)e.style.background=color(n.backgroundColor);if(n.borderRadius)e.style.borderRadius=n.borderRadius+'px';if(n.width)e.style.width=n.width+'px';if(n.height)e.style.height=n.height+'px';if(n.type==='spacer')e.style.flex='1';for(const c of n.children||[])e.append(render(c));}
 if(n.flex)e.style.flex=n.flex+' 1 0';e.style.minWidth='0';return e;}
const rows=[['双不限','剩余话费','12.34','元','剩余语音','200','分钟','已用通用流量','320.50','GB'],['私人','剩余话费','88.00','元','剩余语音','500','分钟','剩余通用流量','120.00','GB'],['备用','剩余话费','5.00','元','剩余语音','1000','分钟','已用通用流量','90.00','GB']];
function fixture(){const m=new Map();rows.forEach((r,i)=>{m.set('egern.unicom3.v1.slot.'+(i+1),{phone:'1300000000'+(i+1),cookie:'synthetic',capturedAt:1,updatedAt:Date.now()-600000,dataSchema:2,data:[{title:r[1],value:r[2],unit:r[3]},{title:r[4],value:r[5],unit:r[6]},{title:r[7],value:r[8],unit:r[9]}]});});return m;}
async function draw(id,env){const m=fixture();const t=await run({env:{VIEW:'all',...env},widgetFamily:'systemMedium',storage:{getJSON:k=>m.get(k),setJSON:(k,v)=>m.set(k,v)},http:{get:()=>{throw Error('fixture cache only')}}});document.getElementById(id).replaceChildren(render(t));}
await draw('a',{CARD1_NAME:'双不限',CARD2_NAME:'私人',CARD3_NAME:'备用'});
await draw('b',{CARD1_NAME:'双不限',CARD2_NAME:'私人',CARD3_NAME:'备用',CARD2_TOTAL:'500GB'});
</script>
