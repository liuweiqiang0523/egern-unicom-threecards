# 无凭据存储共享测试模块。
name: 联通三卡存储共享探针（无敏感信息）
scriptings:
  - http_request:
      name: unicom-probe-writer
      match: '^https://example\.com/egern-storage-probe\?write=1(?:&|$)'
      script_url: https://raw.githubusercontent.com/liuweiqiang0523/egern-unicom-threecards/main/StorageProbe.js
      timeout: 5
      body_required: false
  - generic:
      name: unicom-probe-reader
      script_url: https://raw.githubusercontent.com/liuweiqiang0523/egern-unicom-threecards/main/StorageProbe.js
      timeout: 5
mitm:
  hostnames:
    includes:
      - example.com
widgets:
  - name: 联通探针A
    script_name: unicom-probe-reader
  - name: 联通探针B
    script_name: unicom-probe-reader
