name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: npm run check
      - name: Check isolated passive diagnostic
        run: |
          node --check UnicomOnlineDiagnostic.js
          ruby -e 'require "yaml"; YAML.load_file("UnicomOnlineDiagnostic.yaml"); puts "YAML_OK UnicomOnlineDiagnostic.yaml"'
      - run: npm test
      - name: Fixed-frame adaptive browser regression
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          PREVIEW_OUT=/tmp node preview/verify-adaptive.mjs
      - name: Validate module and workflow YAML
        run: |
          ruby -e 'require "yaml"; ARGV.each { |p| YAML.load_file(p); puts "YAML_OK #{p}" }' UnicomThreeCards.yaml UnicomThreeCardsCompact.yaml UnicomCapture.yaml UnicomLocalWidgets.fragment.yaml .github/workflows/check.yml
