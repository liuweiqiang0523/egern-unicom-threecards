name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: npm run check
      - run: npm test
      - name: Validate module and workflow YAML
        run: ruby -e 'require "yaml"; ARGV.each { |p| YAML.load_file(p); puts "YAML_OK #{p}" }' UnicomThreeCards.yaml .github/workflows/check.yml
