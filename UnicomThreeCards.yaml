# 自动捕获前三个号码，按首次捕获顺序绑定卡1/2/3。
name: 中国联通三卡
description: 打开联通App切换三个号码查询余额，自动获取；三个独立组件
icon: simcard.fill
manual: https://github.com/liuweiqiang0523/egern-unicom-threecards/blob/main/INSTALL.md
# Native Egern controls; defaults are placeholders, not module-level overrides.
env_schema:
  TRANSLUCENT:
    name: 半透明背景
    description: 开启背景透明度；不是系统磨砂材质。关闭恢复不透明背景。
    default_value: "false"
    options:
      - "true"
      - "false"
  WIDGET_TITLE:
    name: 组件标题
    description: 自定义安全短标题，最多24字符；明确设置时始终保留。留空由显示品牌开关决定。
    default_value: ""
  SHOW_BRAND:
    name: 显示品牌前缀
    description: 默认关闭，仅显示别名或卡序；开启使用中国联通前缀，有自定义标题时优先保留该标题。
    default_value: "false"
    options:
      - "true"
      - "false"
  CARD1_NAME:
    name: 卡1别名
    description: 留空显示卡1；安全短文本，截取前12字符；不接受完整手机号。
    default_value: ""
  CARD2_NAME:
    name: 卡2别名
    description: 留空显示卡2；安全短文本，截取前12字符；不接受完整手机号。
    default_value: ""
  CARD3_NAME:
    name: 卡3别名
    description: 留空显示卡3；安全短文本，截取前12字符；不接受完整手机号。
    default_value: ""
  CARD1_TOTAL:
    name: 卡1参考总量
    description: 可选。填写后该卡流量条按真实比例显示（如 500GB 或 500）；不填则按三卡相对长度显示。无限流量卡无需填写，永远不会显示百分比数字。
    default_value: ""
  CARD2_TOTAL:
    name: 卡2参考总量
    description: 可选。填写后该卡流量条按真实比例显示（如 500GB 或 500）；不填则按三卡相对长度显示。无限流量卡无需填写，永远不会显示百分比数字。
    default_value: ""
  CARD3_TOTAL:
    name: 卡3参考总量
    description: 可选。填写后该卡流量条按真实比例显示（如 500GB 或 500）；不填则按三卡相对长度显示。无限流量卡无需填写，永远不会显示百分比数字。
    default_value: ""
  SHOW_PHONE_SUFFIX:
    name: 显示号码尾四位
    description: 默认关闭；开启仅显示脱敏尾四位，不显示完整手机号。锁屏圆形不显示。
    default_value: "false"
    options:
      - "true"
      - "false"
  LOW_BALANCE_THRESHOLD:
    name: 低话费提醒门槛
    description: 默认10元，0关闭；仅话费单位为元且严格低于门槛时强调数字及胶囊，不应用语音或流量。
    default_value: "10"
scriptings:
  - generic:
      name: unicom-threecards-render
      script_url: https://raw.githubusercontent.com/liuweiqiang0523/egern-unicom-threecards/main/UnicomThreeCards.js
      timeout: 20
  - http_request:
      name: unicom-threecards-capture
      match: '^https://m\.client\.10010\.com/mobileserviceimportant/home/queryUserInfoSeven(?:\?|$)'
      script_url: https://raw.githubusercontent.com/liuweiqiang0523/egern-unicom-threecards/main/UnicomThreeCards.js
      timeout: 5
      body_required: false
mitm:
  hostnames:
    includes:
      - m.client.10010.com
widgets:
  - name: 中国联通卡1
    script_name: unicom-threecards-render
    env:
      CARD_SLOT: "1"
  - name: 中国联通卡2
    script_name: unicom-threecards-render
    env:
      CARD_SLOT: "2"
  - name: 中国联通卡3
    script_name: unicom-threecards-render
    env:
      CARD_SLOT: "3"
