<!doctype html><meta charset="utf-8"><title>三卡汇总 DSL 设计预览</title>
<style>body{font:14px system-ui;background:#e7e9ee;padding:24px}#preview{margin-top:20px;box-shadow:0 8px 24px #0002;border-radius:20px;overflow:hidden;box-sizing:border-box}label{margin-right:12px}pre{max-height:220px;overflow:auto}p{max-width:860px}</style>
<h2>三卡合一 · 胶囊 + 流量条 DSL 设计预览</h2><p><b>设计预览，非实机截图。</b>合成测试数据，不是真实余额。本页直接执行仓库 <code>UnicomThreeCards.js</code> 并按返回的 DSL 构造 DOM；浏览器字体/压缩与 Egern 原生渲染不同。卡槽配色蓝/紫/青；无限流量卡渐变淡出并显示 ∞ 与「不限量」；有参考总量才画真实比例。推荐中号。</p>
<label>尺寸 <select id="family"><option>systemMedium</option><option>systemSmall</option><option>systemLarge</option><option>systemExtraLarge</option><option>accessoryRectangular</option><option>accessoryCircular</option><option>accessoryInline</option></select></label>
<label><input id="dark" type="checkbox">深色</label><label><input id="suffix" type="checkbox">尾四位</label><label><input id="fail" type="checkbox">卡2失效</label><label>卡1别名 <input id="alias" value="双不限"></label><label>卡2参考总量 <input id="total" placeholder="可选，如 500GB"></label>
<div id="preview"></div><details><summary>实际 JS 返回的 DSL</summary><pre id="tree"></pre></details>
<script type="module">
import run from '../UnicomThreeCards.js';
const $=id=>document.getElementById(id),color=c=>typeof c==='object'?c[$('dark').checked?'dark':'light']:c;
function render(n){const e=document.createElement('div');e.dataset.type=n.type;const s=e.style;s.boxSizing='border-box';if(n.type==='text'){e.textContent=n.text;s.fontSize=n.font.size+'px';s.fontWeight={regular:400,medium:500,semibold:600,bold:700}[n.font.weight];s.color=color(n.textColor);s.whiteSpace='nowrap';s.overflow='hidden';s.textOverflow='ellipsis';}else{s.display='flex';s.flexDirection=n.direction==='row'?'row':'column';s.alignItems=n.alignItems||'stretch';if(n.gap)s.gap=n.gap+'px';if(n.padding!==undefined)s.padding=Array.isArray(n.padding)?n.padding.map(v=>v+'px').join(' '):n.padding+'px';if(n.backgroundGradient){const g=n.backgroundGradient;s.background='linear-gradient(90deg,'+color(g.colors[0])+','+color(g.colors[1])+')';}else if(n.backgroundColor)s.background=color(n.backgroundColor);if(n.borderRadius)s.borderRadius=n.borderRadius+'px';if(n.width)s.width=n.width+'px';if(n.height)s.height=n.height+'px';if(n.type==='spacer')s.flex='1';for(const c of n.children||[])e.append(render(c));}if(n.flex)s.flex=n.flex+' 1 0';s.minWidth='0';return e;}
async function update(){const rows=[{f:['剩余话费','12.34','元'],v:['剩余语音','200','分钟'],fl:['已用流量','320.50','GB']},{f:['剩余话费','88.00','元'],v:['剩余语音','500','分钟'],fl:['剩余通用流量','120.00','GB']},{f:['剩余话费','5.00','元'],v:['剩余语音','1000','分钟'],fl:['已用流量','90.00','GB']}];const records=new Map(rows.map((r,i)=>['egern.unicom3.v1.slot.'+(i+1),{phone:'1300000000'+(i+1),cookie:'synthetic-not-a-real-cookie',capturedAt:1,updatedAt:Date.now()-120000,dataSchema:2,...($('fail').checked&&i===1?{invalid:true}:{}),data:[{title:r.f[0],value:r.f[1],unit:r.f[2]},{title:r.v[0],value:r.v[1],unit:r.v[2]},{title:r.fl[0],value:r.fl[1],unit:r.fl[2]}]}]));const t=await run({env:{VIEW:'all',CARD1_NAME:$('alias').value,CARD2_TOTAL:$('total').value,SHOW_PHONE_SUFFIX:String($('suffix').checked)},widgetFamily:$('family').value,storage:{getJSON:k=>records.get(k),setJSON:(k,v)=>records.set(k,v)},http:{get:()=>{throw Error('preview must use fixture cache only')}}});const widths={systemMedium:360,systemSmall:170,systemLarge:360,systemExtraLarge:500,accessoryRectangular:170,accessoryCircular:90,accessoryInline:360};$('preview').style.width=widths[$('family').value]+'px';$('preview').replaceChildren(render(t));$('tree').textContent=JSON.stringify(t,null,2);window.lastDSL=t;}
for(const e of document.querySelectorAll('input,select'))e.addEventListener('input',update);await update();
</script>
