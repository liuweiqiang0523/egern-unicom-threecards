<!doctype html><meta charset="utf-8"><title>三卡汇总 胶囊块 DSL 设计预览</title>
<style>body{font:14px system-ui;background:#e7e9ee;padding:24px}#preview{margin-top:20px;box-shadow:0 8px 24px #0002;border-radius:20px;overflow:hidden;box-sizing:border-box}label{margin-right:12px}pre{max-height:220px;overflow:auto}p{max-width:900px}</style>
<h2>三卡合一 · 标题栏 + 每卡大胶囊块 + 流量条 DSL 设计预览</h2><p class="note"><b>黑灰科技风 · 设计预览，非实机截图。</b>合成测试数据。直接执行正式 JS；保留标题、三卡、话费/语音双胶囊与满宽流量胶囊的原结构。模块 #17181B、卡片 #1D1F23、胶囊 #23262B、边框 #292B30；紫/蓝/青仅用于标记、数值和4pt流量条。低余额数字珊瑚红/柔和暖色，不染整块背景。无发光、无伪磨砂；固定尺寸模拟 Egern flex，浏览器与实机字体不同。</p>
<label>尺寸 <select id="family"><option>systemMedium</option><option>systemSmall</option><option>systemLarge</option><option>systemExtraLarge</option><option>accessoryRectangular</option><option>accessoryCircular</option><option>accessoryInline</option></select></label>
<label><input id="dark" type="checkbox">深色</label><label><input id="titlebar" type="checkbox" checked>顶部标题栏</label><label><input id="suffix" type="checkbox">尾四位</label><label><input id="fail" type="checkbox">卡2失效</label><label>卡1别名 <input id="alias" value="双不限"></label><label>卡2参考总量 <input id="total" placeholder="可选，如 500GB"></label><label>卡片顺序 <input id="order" placeholder="1,2,3"></label>
<div id="preview"></div><details><summary>实际 JS 返回的 DSL</summary><pre id="tree"></pre></details>
<script type="module">
import run from '../UnicomThreeCards.js';
const $=id=>document.getElementById(id),color=c=>typeof c==='object'?c[$('dark').checked?'dark':'light']:c;
const localSrc=src=>String(src).includes('unicom-icon.png')?'../assets/unicom-icon.png':src;
// Egern gives a widget child the leftover height when the child's subtree contains `flex` (a spacer
// does NOT hoist). Emulate that here so the preview matches the phone instead of auto-sizing.
const hasFlex=n=>!!(n&&n.flex)||((n&&n.children)||[]).some(hasFlex);
const FRAME={systemSmall:[170,170],systemMedium:[360,158],systemLarge:[360,354],systemExtraLarge:[500,354],accessoryRectangular:[170,76],accessoryCircular:[90,90],accessoryInline:[360,26]};
function render(n){const e=document.createElement('div');e.dataset.type=n.type;const s=e.style;s.boxSizing='border-box';
 if(n.type==='image'){const sz=n.width||15;
  if(String(n.src).startsWith('sf-symbol:')){const g=document.createElement('div');g.style.width=sz+'px';g.style.height=sz+'px';g.style.display='flex';g.style.alignItems='center';g.style.justifyContent='center';g.title=n.src;g.innerHTML='<svg viewBox="0 0 24 24" width="'+sz+'" height="'+sz+'" fill="'+($('dark').checked?'#EDEFF2':'#1B1C1E')+'"><path d="M7 2h7.2L20 7.8V20a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm2.5 9.5v7h5v-7h-5z"/></svg>';e.append(g);e.style.width=sz+'px';return e;}
  const img=document.createElement('img');img.src=localSrc(n.src);img.style.width=sz+'px';img.style.height=(n.height||15)+'px';img.style.objectFit=n.resizeMode||'contain';img.style.display='block';if(n.borderRadius)img.style.borderRadius=n.borderRadius+'px';e.append(img);e.style.width=sz+'px';return e;}
 if(n.type==='text'){e.textContent=n.text;s.fontSize=n.font.size+'px';s.fontWeight={regular:400,medium:500,semibold:600,bold:700}[n.font.weight];s.color=color(n.textColor);s.whiteSpace='nowrap';s.overflow='hidden';s.textOverflow='ellipsis';}
 else{const col=n.type==='widget'||n.direction!=='row';s.display='flex';s.flexDirection=col?'column':'row';s.alignItems=n.alignItems||'stretch';if(n.gap)s.gap=n.gap+'px';if(n.padding!==undefined)s.padding=Array.isArray(n.padding)?n.padding.map(v=>v+'px').join(' '):n.padding+'px';if(n.backgroundGradient){const g=n.backgroundGradient;s.background='linear-gradient(90deg,'+color(g.colors[0])+','+color(g.colors[1])+')';}else if(n.backgroundColor)s.background=color(n.backgroundColor);if(n.borderWidth){s.border=n.borderWidth+'px solid '+(n.borderColor?color(n.borderColor):'transparent');}if(n.borderRadius)s.borderRadius=n.borderRadius+'px';if(n.width)s.width=n.width+'px';if(n.height)s.height=n.height+'px';if(n.type==='spacer')s.flex=col?'1 1 0px':'1 1 0';for(const c of n.children||[]){const el=render(c);if(col&&hasFlex(c)){el.style.flex='1 1 0px';el.style.minHeight='0';}else if(c.flex)el.style.flex=String(c.flex)+' 1 auto';e.append(el);}}
 if(n.flex&&n.type==='widget')s.flex=String(n.flex)+' 1 auto';s.minWidth='0';return e;}
async function update(){const rows=[{f:['剩余话费','12.34','元'],v:['剩余语音','200','分钟'],fl:['已用流量','320.50','GB']},{f:['剩余话费','88.00','元'],v:['剩余语音','500','分钟'],fl:['剩余通用流量','120.00','GB']},{f:['剩余话费','5.00','元'],v:['剩余语音','1000','分钟'],fl:['已用流量','90.00','GB']}];const records=new Map(rows.map((r,i)=>['egern.unicom3.v1.slot.'+(i+1),{phone:'1300000000'+(i+1),cookie:'synthetic-not-a-real-cookie',capturedAt:1,updatedAt:Date.now()-120000,dataSchema:2,...($('fail').checked&&i===1?{invalid:true}:{}),data:[{title:r.f[0],value:r.f[1],unit:r.f[2]},{title:r.v[0],value:r.v[1],unit:r.v[2]},{title:r.fl[0],value:r.fl[1],unit:r.fl[2]}]}]));const t=await run({env:{VIEW:'all',CARD1_NAME:$('alias').value,CARD2_TOTAL:$('total').value,CARD_ORDER:$('order').value,SHOW_BRAND:$('titlebar').checked?'true':'false',SHOW_PHONE_SUFFIX:String($('suffix').checked)},widgetFamily:$('family').value,storage:{getJSON:k=>records.get(k),setJSON:(k,v)=>records.set(k,v)},http:{get:()=>{throw Error('preview must use fixture cache only')}}});const widths={systemMedium:360,systemSmall:170,systemLarge:360,systemExtraLarge:500,accessoryRectangular:170,accessoryCircular:90,accessoryInline:360};const f=FRAME[$('family').value]||FRAME.systemMedium;$('preview').style.width=f[0]+'px';$('preview').style.height=f[1]+'px';$('preview').style.overflow='hidden';$('preview').replaceChildren(render(t));$('tree').textContent=JSON.stringify(t,null,2);window.lastDSL=t;}
for(const e of document.querySelectorAll('input,select'))e.addEventListener('input',update);await update();
</script>
